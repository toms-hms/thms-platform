[project]
name = "thms-api"
version = "0.0.1"
description = "THMS Platform API — Django + Graphene GraphQL"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "graphene-django>=3.2.2",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "django-auditlog>=3.0",
    "django-cors-headers>=4.6",
    "django-ratelimit>=4.1",
    "django-storages[s3]>=1.14",
    "boto3>=1.35",
    "openai>=1.57",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.150",
    "requests>=2.32",
    "redis>=5.2",
    "gunicorn>=23.0",
    "python-dotenv>=1.0",
    "cryptography>=43.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
# DJ001: the schema predates Django and has genuinely nullable text columns;
# collapsing NULL into "" would change what the API returns.
ignore = ["E501", "B008", "DJ001"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "accounts", "homes", "contractors", "user_contractors", "jobs", "quotes", "communications", "ai", "integrations", "uploads"]
