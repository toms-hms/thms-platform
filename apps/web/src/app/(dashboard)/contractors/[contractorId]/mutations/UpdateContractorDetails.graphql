mutation UpdateContractorDetails(
  $contractorId: ID!
  $name: String
  $categories: [TradeCategory!]
  $companyName: String
  $email: String
  $phone: String
  $zipCodes: [String!]
  $notes: String
) {
  updateContractor(
    contractorId: $contractorId
    name: $name
    categories: $categories
    companyName: $companyName
    email: $email
    phone: $phone
    zipCodes: $zipCodes
    notes: $notes
  ) {
    contractor {
      id
      name
      companyName
      email
      phone
      categories
      zipCodes
      notes
    }
  }
}
